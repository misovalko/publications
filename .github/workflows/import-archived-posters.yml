name: Import archived posters

on:
  push:
    paths:
      - .github/workflows/import-archived-posters.yml

permissions:
  contents: write

jobs:
  probe-historical:
    runs-on: ubuntu-latest
    steps:
      - name: Probe old public publication URLs
        shell: bash
        run: |
          set -u
          probe() {
            url="$1"
            tmp="$(mktemp)"
            code=$(curl -L -sS --max-time 30 -o "$tmp" -w '%{http_code}' "$url" || true)
            bytes=$(wc -c < "$tmp" | tr -d ' ')
            head4=$(head -c 4 "$tmp" 2>/dev/null || true)
            printf '%s bytes=%s pdf=%s url=%s\n' "$code" "$bytes" "$head4" "$url"
            rm -f "$tmp"
          }
          base='https://researchers.lille.inria.fr/~valko/hp'
          for f in \
            kveton2010semisupervised.poster.pdf \
            kveton2010semi-supervised.poster.pdf \
            kveton2010semisupervised.poster2.pdf \
            calandriello2016incremental.poster.pdf \
            calandriello2016incremental.dali.poster.pdf \
            calandriello2016sparse-hfs.poster.pdf \
            poster_ssl.pdf; do
            probe "$base/publications/$f"
            probe "$base/serve.php?what=publications%2F$f"
          done

name: Import archived posters

on:
  push:
    paths:
      - .github/workflows/import-archived-posters.yml

permissions:
  contents: write

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect arXiv source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/arxiv-src
          curl -L --fail --retry 3 'https://export.arxiv.org/e-print/1601.05675' -o /tmp/source.tar
          tar -xf /tmp/source.tar -C /tmp/arxiv-src || (cd /tmp/arxiv-src && gunzip -c /tmp/source.tar | tar -xf -)
          echo '--- FILES ---'
          find /tmp/arxiv-src -type f -printf '%P\n' | sort
          echo '--- RELEVANT ---'
          find /tmp/arxiv-src -type f | grep -Ei 'graph_new|final-plot|data\.pdf|toy_result|edge_ratio|l20|l100|legend_|complexity|guarantees|inria|baposter|mathdef|symbolsdef|noReferences|poster' || true
